name: Gateway

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install oelint-adv
        run: pip install oelint-adv

      - name: Lint BitBake recipes
        run: |
          FILES=$(find . -name "*.bb" -o -name "*.bbappend" | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            oelint-adv --suppress oelint.file.requirenotfound,oelint.var.suggestedvar.BUGTRACKER,oelint.var.suggestedvar.CVE_PRODUCT,oelint.var.suggestedvar.SECTION,oelint.vars.multilineident $FILES
          else
            echo "No BitBake recipes found yet"
          fi

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Validate kas.yml
        run: |
          pip install kas
          kas dump kas.yml > /dev/null